<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CRUD Productos{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-bg: #eef2ff;
            --success: #10b981;
            --success-bg: #ecfdf5;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --warning: #f59e0b;
            --warning-bg: #fffbeb;
            --g50: #f9fafb; --g100: #f3f4f6; --g200: #e5e7eb; --g300: #d1d5db;
            --g400: #9ca3af; --g500: #6b7280; --g600: #4b5563; --g700: #374151;
            --g800: #1f2937; --g900: #111827;
            --radius: 12px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--g50); color: var(--g800);
            min-height: 100vh; display: flex; flex-direction: column;
        }

        /* Navbar */
        .nav-app { background: #fff; border-bottom: 1px solid var(--g200); padding: .75rem 0; position: sticky; top: 0; z-index: 100; }
        .nav-app .brand { font-weight: 800; font-size: 1.25rem; color: var(--g900); text-decoration: none; display: flex; align-items: center; gap: .6rem; }
        .nav-app .brand:hover { color: var(--accent); }
        .nav-app .brand-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 1.1rem; }
        .btn-add { background: var(--accent); color: #fff; border: none; font-weight: 600; font-size: .875rem; padding: .5rem 1.15rem; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: .4rem; transition: .2s; }
        .btn-add:hover { background: var(--accent-hover); color: #fff; box-shadow: 0 4px 12px rgba(99,102,241,.35); }

        /* Main */
        .main { flex: 1; padding: 1.75rem 0 3rem; }

        /* Card */
        .card-app { background: #fff; border: 1px solid var(--g200); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; }
        .card-head { padding: 1rem 1.5rem; border-bottom: 1px solid var(--g200); }
        .card-head h5 { margin: 0; font-weight: 700; font-size: 1.05rem; color: var(--g900); display: flex; align-items: center; gap: .5rem; }
        .card-head h5 i { color: var(--accent); }
        .card-head-danger { background: var(--danger-bg); }
        .card-head-danger h5 i { color: var(--danger); }

        /* Table */
        .tbl { margin: 0; }
        .tbl thead th { background: var(--g50); color: var(--g500); font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; padding: .75rem 1.25rem; border-bottom: 1px solid var(--g200); white-space: nowrap; }
        .tbl tbody tr { transition: background .15s; border-bottom: 1px solid var(--g100); }
        .tbl tbody tr:last-child { border-bottom: none; }
        .tbl tbody tr:hover { background: var(--accent-bg); }
        .tbl tbody td { padding: .85rem 1.25rem; vertical-align: middle; font-size: .9rem; color: var(--g700); }
        .tbl .name { font-weight: 600; color: var(--g900); }

        /* Icon buttons */
        .ib { width: 34px; height: 34px; border-radius: 8px; border: none; display: inline-flex; align-items: center; justify-content: center; font-size: .95rem; transition: .2s; text-decoration: none; cursor: pointer; }
        .ib-view { background: var(--accent-bg); color: var(--accent); }
        .ib-view:hover { background: var(--accent); color: #fff; }
        .ib-edit { background: var(--warning-bg); color: var(--warning); }
        .ib-edit:hover { background: var(--warning); color: #fff; }
        .ib-del { background: var(--danger-bg); color: var(--danger); }
        .ib-del:hover { background: var(--danger); color: #fff; }

        /* Buttons */
        .b-primary { background: var(--accent); border: none; color: #fff; font-weight: 600; font-size: .875rem; padding: .6rem 1.5rem; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: .4rem; transition: .2s; cursor: pointer; }
        .b-primary:hover { background: var(--accent-hover); color: #fff; box-shadow: 0 4px 12px rgba(99,102,241,.3); }
        .b-danger { background: var(--danger); border: none; color: #fff; font-weight: 600; font-size: .875rem; padding: .6rem 1.5rem; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: .4rem; transition: .2s; cursor: pointer; }
        .b-danger:hover { background: #dc2626; color: #fff; box-shadow: 0 4px 12px rgba(239,68,68,.3); }
        .b-outline { background: #fff; border: 1px solid var(--g300); color: var(--g700); font-weight: 600; font-size: .875rem; padding: .6rem 1.5rem; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: .4rem; transition: .2s; cursor: pointer; }
        .b-outline:hover { background: var(--g100); border-color: var(--g400); color: var(--g900); }
        .b-warn { background: var(--warning); border: none; color: #fff; font-weight: 600; font-size: .875rem; padding: .6rem 1.5rem; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: .4rem; transition: .2s; cursor: pointer; }
        .b-warn:hover { background: #d97706; color: #fff; box-shadow: 0 4px 12px rgba(245,158,11,.3); }

        /* Badges */
        .bg-ok { display: inline-flex; align-items: center; gap: .3rem; font-weight: 600; font-size: .75rem; padding: .3rem .7rem; border-radius: 6px; background: var(--success-bg); color: var(--success); }
        .bg-no { display: inline-flex; align-items: center; gap: .3rem; font-weight: 600; font-size: .75rem; padding: .3rem .7rem; border-radius: 6px; background: var(--danger-bg); color: var(--danger); }

        /* Alert */
        .alert-app { border: none; border-radius: 10px; padding: .85rem 1.25rem; font-weight: 500; font-size: .9rem; display: flex; align-items: center; gap: .5rem; animation: si .3s ease-out; }
        .alert-app.alert-success { background: var(--success-bg); color: #065f46; }
        .alert-app.alert-success i { color: var(--success); }
        @keyframes si { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

        /* Page title */
        .ptitle { font-weight: 800; font-size: 1.5rem; color: var(--g900); display: flex; align-items: center; gap: .6rem; }
        .ptitle i { color: var(--accent); font-size: 1.3rem; }

        /* Count chip */
        .chip { display: inline-flex; align-items: center; gap: .35rem; background: var(--accent-bg); color: var(--accent); font-weight: 700; font-size: .8rem; padding: .35rem .85rem; border-radius: 20px; }

        /* Empty state */
        .empty { padding: 4rem 2rem; text-align: center; }
        .empty .eicon { width: 72px; height: 72px; border-radius: 16px; background: var(--accent-bg); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 1.25rem; }
        .empty h4 { font-weight: 700; color: var(--g800); margin-bottom: .5rem; }
        .empty p { color: var(--g400); font-size: .95rem; margin-bottom: 1.5rem; }

        /* Form */
        .form-label { font-weight: 600; color: var(--g700); font-size: .875rem; margin-bottom: .35rem; }
        .form-control, .form-select { border-radius: 8px; padding: .6rem .85rem; border: 1px solid var(--g300); font-size: .9rem; transition: .2s; }
        .form-control:focus, .form-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
        textarea.form-control { min-height: 100px; }

        /* Detail row */
        .drow { display: flex; justify-content: space-between; align-items: center; padding: .85rem 0; border-bottom: 1px solid var(--g100); }
        .drow:last-child { border-bottom: none; }
        .drow .dl { font-weight: 600; color: var(--g500); font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; display: flex; align-items: center; gap: .4rem; }
        .drow .dl i { font-size: .9rem; }
        .drow .dv { font-weight: 500; color: var(--g800); font-size: .95rem; }
        .price { font-weight: 700; color: var(--success); }

        /* Footer */
        .ftr { background: #fff; border-top: 1px solid var(--g200); padding: 1.25rem 0; margin-top: auto; text-align: center; }
        .ftr p { margin: 0; font-size: .8rem; color: var(--g400); }
        .ftr span { font-weight: 700; color: var(--accent); }

        @media (max-width: 768px) {
            .nav-app .brand { font-size: 1.1rem; }
            .btn-add { padding: .45rem .9rem; font-size: .8rem; }
            .main { padding: 1rem 0 2rem; }
            .ptitle { font-size: 1.25rem; }
            .tbl tbody td, .tbl thead th { padding: .65rem .75rem; font-size: .8rem; }
            .ib { width: 30px; height: 30px; font-size: .85rem; }
        }
    </style>
</head>
<body>
<nav class="nav-app">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="brand" href="{% url 'lista_productos' %}">
            <span class="brand-icon"><i class="bi bi-box-seam-fill"></i></span>
            Gesti&oacute;n de Productos
        </a>
        <a href="{% url 'crear_producto' %}" class="btn-add">
            <i class="bi bi-plus-lg"></i> Nuevo Producto
        </a>
    </div>
</nav>
<div class="main">
    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-dismissible alert-app alert-{{ message.tags }} mb-3" role="alert">
                    <i class="bi bi-check-circle-fill"></i>
                    <span>{{ message }}</span>
                    <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" style="font-size:.7rem;"></button>
                </div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</div>
<footer class="ftr">
    <div class="container">
        <p><span>Gesti&oacute;n de Productos</span> &mdash; Taller 2 &mdash; CRUD con Django MVT &mdash; 2026</p>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
